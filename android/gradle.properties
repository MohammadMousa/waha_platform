org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Geidea's SDK (net.geidea.sdk:pos-comm-sdk-ksa) transitively pulls in the
# old com.android.support:* libraries (appcompat-v7, design, etc. — never
# migrated to AndroidX), which collide with AndroidX's own equivalents
# during manifest merging without this. Jetifier rewrites those old
# references to AndroidX at build time.
android.enableJetifier=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
