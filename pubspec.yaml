name: waha_kiosk
description: Waha self-service kiosk client (Phase 1 — scan, cart, checkout, pay, receipt)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  http: ^1.2.0
  provider: ^6.1.2
  uuid: ^4.4.0
  mobile_scanner: ^5.2.3
  shared_preferences: ^2.2.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
